services:
  # Hermes Agent — the CLIENT-FACING front door for webintelligenz.
  #
  # One Hermes per client. This is deliberate: the client's LiteLLM virtual key lives here, so a
  # conversation can only ever spend that client's budget, and their conversation history stays in
  # their own volume. It is a different product from the fleet runtime — Hermes holds the
  # conversation, the fleet does the work.
  #
  # ─────────────────────────────────────────────────────────────────────────────────────────────
  # THIS STACK HAS EXACTLY ONE SERVICE, AND MUST KEEP HAVING EXACTLY ONE.
  #
  # The image registers a SUPERVISED `gateway-default` s6 slot in EVERY container that mounts
  # hermes-home, and auto-starts it (`hermes gateway run --replace`) whenever gateway_state.json
  # records `desired_state: running` — and that file lives on the shared volume. So a second
  # container is not "another surface", it is a SECOND GATEWAY that steals ownership of the
  # fleet's messaging platforms: on 2026-09-04 an added `hermes serve` sidecar flipped
  # gateway_state.json's writer_pid for `email`, `a2a` AND `api_server` to itself.
  # There is NO env switch to opt a container out (the image's only opt-out is argv-based —
  # `container_boot._is_dashboard_container` skips reconciliation when PID 1 argv starts with
  # `dashboard`, which a `serve` sidecar does not match).
  #
  # Extra HTTP surfaces therefore go on THIS container, via the s6 slots the image already
  # ships. See the HERMES_DASHBOARD block below. Superseded attempt: PR #4 (do not merge).
  # ─────────────────────────────────────────────────────────────────────────────────────────────
  hermes-agent:
    # UPGRADED 2026-08-19 from v2026.7.7.2 (v0.18.2) — the old wheel-build pin is obsolete.
    #
    # WHY WE NEEDED THE UPGRADE: A2A. Hermes implements Agent2Agent v1.0 bidirectionally via a
    # bundled plugin (agent card at /.well-known/agent-card.json, JSON-RPC 2.0 at POST /, plus
    # a2a_discover/a2a_call tools). v0.18.2 does NOT ship it — verified: 85 bundled plugins, zero a2a.
    # A2A is what lets PM and Hermes talk through LiteLLM's agent gateway instead of a custom shim.
    image: 'nousresearch/hermes-agent:v2026.8.18'
    command: 'gateway run'
    restart: unless-stopped
    environment:
      - HERMES_HOME=/home/hermes/.hermes
      - HERMES_UID=1000
      - HERMES_GID=1000
      # The LiteLLM virtual key for THIS client. Hermes reads OpenAI-compatible providers from
      # env; config.yaml points the provider's base_url at the LiteLLM proxy, so every turn is
      # budgeted, logged and traced like the rest of the fleet.
      - 'OPENAI_API_KEY=${OPENAI_API_KEY}'
      # ClickUp REST credential — a personal API token on the AI Agent account (106813628), which
      # is the identity that makes the bot's own DM/GROUP_DM channels visible. Used ONLY by the
      # intake monitors (scripts/monitor_tasks.py, scripts/monitor_chat.py) for polling.
      #
      # It cannot be the MCP's credential: ClickUp's hosted MCP is OAuth-only and its service JWT
      # is rejected by REST with 401 OAUTH_019. And polling cannot run on the MCP at all — that is
      # capped at 300 calls per 24h, versus REST's 100 per MINUTE. Agent ACTIONS (including
      # clickup_send_chat_message) still go through the MCP; only DETECTION lives here.
      - 'CLICKUP_API_TOKEN=${CLICKUP_API_TOKEN}'
      # --- A2A inbound (PM -> Hermes). Tailnet-only: A2A_HOST widens the CONTAINER bind, and the
      # published port below pins the HOST side to the Tailscale IP. ---
      - A2A_HOST=0.0.0.0            # widens off 127.0.0.1 ONLY because a token is set below
      - A2A_PORT=9900
      # Per-peer token: caller identity is 'fleet' (drives audit/trust), not an IP. The secret half
      # is a Coolify-managed SERVICE_PASSWORD_* — generated by Coolify, never in source or transcript.
      - 'A2A_PEER_TOKENS=fleet:${SERVICE_PASSWORD_A2ATOKEN}'
      - A2A_TRUSTED_PEERS=fleet     # explicit allowlist — an authed peer is refused unless named
      - A2A_AGENT_NAME=hermes-webintelligenz
      # --- Hermes Desktop / browser backend, ON THIS CONTAINER (2026-09-04). ---
      # Hermes Desktop's remote-connect readiness loop probes GET /api/health -> GET /api/status
      # -> WS /api/ws. Those routes are served ONLY by the tui_gateway/FastAPI backend behind
      # `hermes dashboard` / `hermes serve` (default port 9119) — NOT by `hermes gateway run`,
      # NOT by the A2A endpoint on 9900, and NOT by the api_server platform on 8642. Pointing
      # Desktop at any of those returns a bare 404 in a ~45s boot loop that looks like a network
      # fault but is not.
      #
      # `dashboard` and `serve` are ONE backend (cmd_dashboard -> web_server.start_server);
      # `serve` only adds headless_backend=True to skip the SPA build. So the image's supervised
      # `dashboard` slot serves exactly the /api/* contract Desktop needs — and, unlike a `serve`
      # sidecar, it runs INSIDE this container, adding no second gateway. Enabling it starts no
      # `gateway run`: the slot's run script execs `hermes dashboard` and nothing else, and
      # start_server only forks a gateway/cron ticker under HERMES_DESKTOP=1, which is unset here.
      - HERMES_DASHBOARD=1
      # 0.0.0.0 is the CONTAINER-side bind; the published port below pins the HOST side to the
      # Tailscale IP, so this stays tailnet-only despite the wildcard bind (same shape as A2A).
      - HERMES_DASHBOARD_HOST=0.0.0.0
      - HERMES_DASHBOARD_PORT=9119
      # Auth is MANDATORY and fail-closed. should_require_auth() treats ANY non-loopback bind —
      # tailnet and RFC1918 included — as public and engages the gate; start_server then REFUSES
      # to boot unless a real DashboardAuthProvider is registered. HERMES_DASHBOARD_INSECURE has
      # been a no-op since the June 2026 hardening, and the static session token is rejected once
      # gated, so the bundled dashboard_auth/basic provider is the minimum viable config.
      # Values are Coolify-managed env vars — never literals in source.
      - 'HERMES_DASHBOARD_BASIC_AUTH_USERNAME=${HERMES_DASHBOARD_BASIC_AUTH_USERNAME}'
      - 'HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD}'
      # HMAC signing key for the session cookie. WITHOUT it the provider falls back to a random
      # per-process key, so every restart logs everyone out.
      - 'HERMES_DASHBOARD_BASIC_AUTH_SECRET=${HERMES_DASHBOARD_BASIC_AUTH_SECRET}'
    volumes:
      - 'hermes-home:/home/hermes/.hermes'
      - 'hermes-agent-src:/opt/hermes'
    # Both published ports are HostIp-scoped to the Tailscale address, so neither is reachable on
    # the public IP even though Traefik is off. Verify after any change: the public IP must refuse.
    ports:
      - '100.115.104.5:18794:9900'   # A2A  (agent card + JSON-RPC, bearer-authed)
      - '100.115.104.5:18795:9119'   # Hermes Desktop backend / dashboard SPA (basic-authed)
    labels:
      # The agent stays off Traefik entirely — the gateway must never be reachable from the
      # internet. Reachability is the two tailnet-scoped publishes above, nothing else.
      - traefik.enable=false
    healthcheck:
      test: ['CMD-SHELL', 'test -d /home/hermes/.hermes || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5

# NOTE — `hermes-webui` (ghcr.io/nesquena/hermes-webui) used to be a second service here, public at
# wi-agent.widev.com.au behind HERMES_WEBUI_PASSWORD. It was removed from the deployed stack on
# 2026-09-04. Do NOT restore it as a compose service: it mounts hermes-home, which makes it exactly
# the second-gateway hazard described at the top of this file. The `HERMES_DASHBOARD` slot above
# now serves the same browser SPA from inside the agent container, tailnet-only instead of public.
# Consequence to be aware of: wi-agent.widev.com.au currently returns 503 (no backend). Restoring a
# PUBLIC browser UI is an open decision — see CLAUDE.md §16.
