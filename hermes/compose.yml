services:
  # Hermes Agent — the CLIENT-FACING front door for webintelligenz.
  #
  # One Hermes per client. This is deliberate: the client's LiteLLM virtual key lives here, so a
  # conversation can only ever spend that client's budget, and their conversation history stays in
  # their own volume. It is a different product from the fleet runtime (OpenClaw) — Hermes holds the
  # conversation, the fleet does the work.
  hermes-agent:
    # UPGRADED 2026-08-19 from v2026.7.7.2 (v0.18.2) — the pin is obsolete.
    #
    # WHY IT WAS PINNED: hermes-agent v0.19.0+ refuses to be built as a wheel ("Building wheels or
    # sdists for hermes-agent is not supported — use editable install"), and hermes-webui's
    # docker_init.bash did `uv pip install "$_stage_src[all]"` — a wheel install — so every agent from
    # v0.19.0 on crash-looped the webui. Upstream nesquena/hermes-webui#6558.
    #
    # WHY IT IS FIXED: that issue closed 2026-07-29T20:51:57Z, one minute after webui v0.52.106 was
    # published. docker_init.bash now does `uv pip install -e "$_stage_src[all]"` — an EDITABLE
    # install, exactly what the agent demands. Verified against master before upgrading.
    #
    # WHY WE NEEDED THE UPGRADE: A2A. Hermes implements Agent2Agent v1.0 bidirectionally via a
    # bundled plugin (agent card at /.well-known/agent-card.json, JSON-RPC 2.0 at POST /, plus
    # a2a_discover/a2a_call tools). v0.18.2 does NOT ship it — verified: 85 bundled plugins, zero a2a.
    # A2A is what lets PM and Hermes talk through LiteLLM's agent gateway instead of a custom shim.
    image: 'nousresearch/hermes-agent:v2026.8.18'
    command: 'gateway run'
    restart: unless-stopped
    environment:
      - HERMES_HOME=/home/hermes/.hermes
      - HERMES_UID=1000
      - HERMES_GID=1000
      # The LiteLLM virtual key for THIS client. Hermes reads OpenAI-compatible providers from
      # env; config.yaml points the provider's base_url at the LiteLLM proxy, so every turn is
      # budgeted, logged and traced like the rest of the fleet.
      - 'OPENAI_API_KEY=${OPENAI_API_KEY}'
      # ClickUp REST credential — a personal API token on the AI Agent account (106813628), which
      # is the identity that makes the bot's own DM/GROUP_DM channels visible. Used ONLY by the
      # intake monitors (scripts/monitor_tasks.py, scripts/monitor_chat.py) for polling.
      #
      # It cannot be the MCP's credential: ClickUp's hosted MCP is OAuth-only and its service JWT
      # is rejected by REST with 401 OAUTH_019. And polling cannot run on the MCP at all — that is
      # capped at 300 calls per 24h, versus REST's 100 per MINUTE. Agent ACTIONS (including
      # clickup_send_chat_message) still go through the MCP; only DETECTION lives here.
      - 'CLICKUP_API_TOKEN=${CLICKUP_API_TOKEN}'
      # --- A2A inbound (PM -> Hermes via LiteLLM's A2A proxy). Internal-only: bound to the docker
      # network, NO published port and traefik disabled, so it is never internet-facing. ---
      - A2A_HOST=0.0.0.0            # widens off 127.0.0.1 ONLY because a token is set below
      - A2A_PORT=9900
      # Per-peer token: caller identity is 'fleet' (drives audit/trust), not an IP. The secret half
      # is a Coolify-managed SERVICE_PASSWORD_* — generated by Coolify, never in source or transcript.
      - 'A2A_PEER_TOKENS=fleet:${SERVICE_PASSWORD_A2ATOKEN}'
      - A2A_TRUSTED_PEERS=fleet     # explicit allowlist — an authed peer is refused unless named
      - A2A_AGENT_NAME=hermes-webintelligenz
    volumes:
      - 'hermes-home:/home/hermes/.hermes'
      - 'hermes-agent-src:/opt/hermes'
    labels:
      # The AGENT stays internal. Only the webui is public — the gateway itself must never be
      # directly reachable from the internet.
      - traefik.enable=false
    healthcheck:
      test: ['CMD-SHELL', 'test -d /home/hermes/.hermes || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5

  hermes-webui:
    # PINNED BY DIGEST = webui 0.52.247. The RELEASED 0.52.113 still wheel-builds the agent
    # (`setuptools build_wheel`), which agent v0.19.0+ REFUSES — verified: it crash-looped here on
    # 2026-08-19. The editable-install fix (`uv pip install -e` from a staged writable copy) is only
    # in 0.52.247/master, not in any earlier release tag. Pinned by digest rather than `:latest` so a
    # future recreate can't silently pull a newer, possibly-broken build onto this public service.
    # NB: 0.52.247 is an exp/prerelease — the only webui that installs the A2A-capable agent today.
    image: 'ghcr.io/nesquena/hermes-webui@sha256:d483b07b3c46d8e2258fdb2eee3c1de36172c1bb5c9955e3436a0fa05c99492b'
    depends_on:
      - hermes-agent
    restart: unless-stopped
    environment:
      - HERMES_WEBUI_HOST=0.0.0.0
      - HERMES_WEBUI_PORT=8787
      - HERMES_WEBUI_STATE_DIR=/home/hermeswebui/.hermes/webui
      - WANTED_UID=1000
      - WANTED_GID=1000
      - 'HERMES_WEBUI_PASSWORD=${SERVICE_PASSWORD_HERMESWEBUI}'
    volumes:
      - 'hermes-home:/home/hermeswebui/.hermes'
      - 'hermes-agent-src:/home/hermeswebui/.hermes/hermes-agent:ro'
      - 'hermes-workspace:/workspace'
    # PUBLIC — client-facing by decision (2026-08-19). Reachable at wi-agent.widev.com.au.
    #
    # SECURITY POSTURE, stated plainly because it is the whole control surface:
    # HERMES_WEBUI_PASSWORD is the ONLY thing between the internet and an agent holding this
    # client's LiteLLM key and their conversation history. There is no IP allowlist, no SSO and no
    # second factor. Anyone who discovers the hostname reaches the login page. The blast radius is
    # bounded by the key being per-client and budget-capped ($50/30d), not by the network.
    #
    # The Tailscale bind below is kept as a separate admin path that does not depend on Traefik.
    ports:
      - '100.115.104.5:18793:8787'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1:8787/health']
      interval: 30s
      timeout: 5s
      retries: 3
