services:
  # Hermes Agent — the CLIENT-FACING front door for webintelligenz.
  #
  # One Hermes per client. This is deliberate: the client's LiteLLM virtual key lives here, so a
  # conversation can only ever spend that client's budget, and their conversation history stays in
  # their own volume. It is a different product from the fleet runtime (OpenClaw) — Hermes holds the
  # conversation, the fleet does the work.
  hermes-agent:
    # UPGRADED 2026-08-19 from v2026.7.7.2 (v0.18.2) — the pin is obsolete.
    #
    # The old wheel-install pin (agent v0.19.0+ crash-looping hermes-webui, upstream
    # nesquena/hermes-webui#6558) is now doubly dead: fixed upstream on 2026-07-29, and the webui
    # itself was removed on 2026-09-04. Nothing here builds the agent as a wheel any more.
    #
    # WHY WE NEEDED THE UPGRADE: A2A. Hermes implements Agent2Agent v1.0 bidirectionally via a
    # bundled plugin (agent card at /.well-known/agent-card.json, JSON-RPC 2.0 at POST /, plus
    # a2a_discover/a2a_call tools). v0.18.2 does NOT ship it — verified: 85 bundled plugins, zero a2a.
    # A2A is what lets PM and Hermes talk through LiteLLM's agent gateway instead of a custom shim.
    image: 'nousresearch/hermes-agent:v2026.8.18'
    command: 'gateway run'
    restart: unless-stopped
    environment:
      - HERMES_HOME=/home/hermes/.hermes
      - HERMES_UID=1000
      - HERMES_GID=1000
      # The LiteLLM virtual key for THIS client. Hermes reads OpenAI-compatible providers from
      # env; config.yaml points the provider's base_url at the LiteLLM proxy, so every turn is
      # budgeted, logged and traced like the rest of the fleet.
      - 'OPENAI_API_KEY=${OPENAI_API_KEY}'
      # ClickUp REST credential — a personal API token on the AI Agent account (106813628), which
      # is the identity that makes the bot's own DM/GROUP_DM channels visible. Used ONLY by the
      # intake monitors (scripts/monitor_tasks.py, scripts/monitor_chat.py) for polling.
      #
      # It cannot be the MCP's credential: ClickUp's hosted MCP is OAuth-only and its service JWT
      # is rejected by REST with 401 OAUTH_019. And polling cannot run on the MCP at all — that is
      # capped at 300 calls per 24h, versus REST's 100 per MINUTE. Agent ACTIONS (including
      # clickup_send_chat_message) still go through the MCP; only DETECTION lives here.
      - 'CLICKUP_API_TOKEN=${CLICKUP_API_TOKEN}'
      # --- A2A inbound (PM -> Hermes via LiteLLM's A2A proxy). Published on the TAILNET IP only
      # (see ports: below) and traefik disabled, so it is never internet-facing. ---
      - A2A_HOST=0.0.0.0            # widens off 127.0.0.1 ONLY because a token is set below
      - A2A_PORT=9900
      # Per-peer token: caller identity is 'fleet' (drives audit/trust), not an IP. The secret half
      # is a Coolify-managed SERVICE_PASSWORD_* — generated by Coolify, never in source or transcript.
      - 'A2A_PEER_TOKENS=fleet:${SERVICE_PASSWORD_A2ATOKEN}'
      - A2A_TRUSTED_PEERS=fleet     # explicit allowlist — an authed peer is refused unless named
      - A2A_AGENT_NAME=hermes-webintelligenz
    volumes:
      - 'hermes-home:/home/hermes/.hermes'
      - 'hermes-agent-src:/opt/hermes'
    # A2A endpoint, tailnet-only (added 2026-09-04). Bound to the Tailscale IP so the public
    # interface never sees it; the HTTPS front on :8447 is a host-level `tailscale serve` proxy in
    # front of this, NOT a second binding. Do not move or unbind this — Hermes Desktop uses 18795.
    ports:
      - '100.115.104.5:18794:9900'
    labels:
      # NOTHING in this stack is internet-facing any more (the public webui was removed
      # 2026-09-04). Both containers are traefik.enable=false and publish only on the
      # tailnet IP 100.115.104.5, so every entry point requires being on the tailnet.
      - traefik.enable=false
    healthcheck:
      test: ['CMD-SHELL', 'test -d /home/hermes/.hermes || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5

  # Hermes SERVE — the headless backend the team's Hermes Desktop clients connect to.
  #
  # WHY THIS EXISTS (and why the webui could not do it): Hermes Desktop's remote mode probes
  # GET /api/health, GET /api/status, then WS /api/ws. Those `/api/*` routes are served ONLY by
  # `hermes serve` (the tui_gateway/FastAPI backend, default port 9119). They are NOT served by
  # `gateway run` (messaging/cron/A2A only), by the A2A endpoint on :9900, or by the api_server
  # platform on :8642 — which is why every earlier attempt to point Desktop at :18794 got a bare
  # 404 in a 45s boot loop. `serve` also sets headless_backend=True, so it skips the web UI build
  # (no npm at boot) and never serves the SPA.
  #
  # SAME image and SAME hermes-home volume as the agent, so this is the SAME Webster: one set of
  # SOULs, profiles, sessions, memory and kanban — not a second agent. `serve` runs agent turns, so
  # it needs the sandbox wiring too: re-run setup-sandbox.sh after every redeploy or
  # terminal/code_execution silently fall back to running INSIDE this container.
  hermes-serve:
    image: 'nousresearch/hermes-agent:v2026.8.18'
    command: 'serve --host 0.0.0.0 --port 9119'
    depends_on:
      - hermes-agent
    restart: unless-stopped
    environment:
      - HERMES_HOME=/home/hermes/.hermes
      - HERMES_UID=1000
      - HERMES_GID=1000
      - 'OPENAI_API_KEY=${OPENAI_API_KEY}'
      # AUTH IS MANDATORY HERE, not optional. should_require_auth() treats ANY non-loopback bind —
      # including this tailnet address — as public and engages the gate; once gated the static
      # dashboard session token is rejected, so a real provider must be registered or the backend
      # is unusable. These three register the bundled dashboard_auth/basic provider, which is what
      # /api/status then advertises as auth_providers:["basic"] for Desktop to render a login form.
      # Values are Coolify-managed secrets — never in source, never printed.
      - 'HERMES_DASHBOARD_BASIC_AUTH_USERNAME=${SERVICE_USER_HERMESSERVE}'
      - 'HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=${SERVICE_PASSWORD_HERMESSERVE}'
      # HMAC key signing the stateless session tokens. Without it a random per-process key is used
      # and every restart silently logs the whole team out.
      - 'HERMES_DASHBOARD_BASIC_AUTH_SECRET=${SERVICE_PASSWORD_HERMESSERVESECRET}'
    volumes:
      # hermes-home is THE shared state — same Webster as the agent, not a copy.
      - 'hermes-home:/home/hermes/.hermes'
      # /opt/hermes is the baked install tree; stage2 explicitly never chowns or writes it, so
      # sharing it with the agent is read-only in practice.
      - 'hermes-agent-src:/opt/hermes'
      - 'hermes-workspace:/workspace'
    # TAILNET ONLY — bound to the Tailscale IP, so it is unreachable on the public interface
    # (verified: 46.250.245.204:18795 -> refused). 18794 stays with A2A, untouched.
    ports:
      - '100.115.104.5:18795:9119'
    labels:
      # Never internet-facing. Also keeps this container off Traefik entirely, which is why giving
      # it extra docker networks cannot repeat the 2026-08-26 route-drop outage.
      - traefik.enable=false
    healthcheck:
      # /api/health is on the unauthenticated allowlist, so this passes with the auth gate ON.
      test:
        - CMD
        - curl
        - '-f'
        - 'http://127.0.0.1:9119/api/health'
      interval: 30s
      timeout: 5s
      retries: 3
