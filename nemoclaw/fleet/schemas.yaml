# JSON schemas every stage output is validated against.
#
# NOT decoration. With open-weight models, free-text handoffs drift and a stage will happily
# report success it did not achieve ("I uploaded the image" with no image). The runner validates
# each output against its schema BEFORE advancing, and a schema miss is a stage failure that
# triggers retry/abort — never a silent pass.
#
# Rule of thumb when adding one: include a field that is hard to fake. `wordpress_post_id` is
# better than `published: true`, because the runner can independently verify a post ID exists.

schemas:

  research_brief:
    type: object
    required: [summary, key_facts, keywords, sources]
    additionalProperties: false
    properties:
      summary: {type: string, minLength: 40}
      key_facts:
        type: array
        minItems: 1
        items:
          type: object
          required: [claim, source_url]
          properties:
            claim: {type: string}
            source_url: {type: string}   # a claim with no source is not a fact
      keywords:
        type: array
        minItems: 1
        items: {type: string}
      sources:
        type: array
        minItems: 1
        items: {type: string}

  article_draft:
    type: object
    required: [title, body_markdown, word_count, image_briefs]
    additionalProperties: false
    properties:
      title: {type: string, minLength: 10}
      body_markdown: {type: string, minLength: 400}
      word_count: {type: integer, minimum: 100}
      image_briefs:
        type: array
        items:
          type: object
          required: [slot, prompt]
          properties:
            slot: {type: string, enum: [featured, inline1, inline2, inline3]}
            prompt: {type: string, minLength: 20}

  seo_meta:
    type: object
    required: [meta_title, meta_description, primary_keyword, slug]
    additionalProperties: false
    properties:
      meta_title: {type: string, maxLength: 60}
      meta_description: {type: string, maxLength: 160}
      primary_keyword: {type: string}
      slug: {type: string}
      internal_links:
        type: array
        items: {type: string}

  image_set:
    type: object
    required: [images]
    additionalProperties: false
    properties:
      images:
        type: array
        minItems: 1
        items:
          type: object
          required: [slot, url, width, height]
          properties:
            slot: {type: string}
            url: {type: string}
            # dimensions are required so the runner can reject the "fabricated placeholder"
            # failure mode seen previously — a real render has real dimensions.
            width: {type: integer, minimum: 512}
            height: {type: integer, minimum: 512}

  qa_verdict:
    type: object
    required: [passed, checks, reasons]
    additionalProperties: false
    properties:
      passed: {type: boolean}
      checks:
        type: object
        required: [brand_fit, factual_support, compliance]
        properties:
          brand_fit: {type: boolean}
          factual_support: {type: boolean}
          # greenwashing / ACL exposure — the reason QA exists as a hard gate
          compliance: {type: boolean}
      reasons:
        type: array
        items: {type: string}

  gmb_post:
    type: object
    required: [body, cta]
    additionalProperties: false
    properties:
      # hard platform rules, enforced by schema not by prompt
      body: {type: string, maxLength: 1500}
      cta: {type: string, enum: [BOOK, ORDER, SHOP, LEARN_MORE, SIGN_UP, CALL]}
      image_url: {type: string}

  publish_result:
    type: object
    required: [published, target, remote_id, url]
    additionalProperties: false
    properties:
      published: {type: boolean}
      target: {type: string, enum: [wordpress, gmb, postiz, mailchimp]}
      # remote_id + url are independently verifiable by the runner, unlike a bare boolean
      remote_id: {type: string, minLength: 1}
      url: {type: string, minLength: 1}

  consult_answer:
    type: object
    required: [answer, confidence]
    additionalProperties: false
    properties:
      answer: {type: string, minLength: 1}
      confidence: {type: string, enum: [high, medium, low]}
      caveats:
        type: array
        items: {type: string}
