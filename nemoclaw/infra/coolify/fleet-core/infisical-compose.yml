services:
  infisical:
    image: infisical/infisical:latest-postgres
    restart: unless-stopped
    depends_on:
      infisical-postgres:
        condition: service_healthy
      infisical-redis:
        condition: service_healthy
    environment:
      - ENCRYPTION_KEY=${INFISICAL_ENCRYPTION_KEY}
      - AUTH_SECRET=${INFISICAL_AUTH_SECRET}
      - DB_CONNECTION_URI=postgresql://infisical:${INFISICAL_POSTGRES_PASSWORD}@infisical-postgres:5432/infisical
      - REDIS_URL=redis://:${INFISICAL_REDIS_PASSWORD}@infisical-redis:6379
      - SITE_URL=http://infisical:8080
      - TELEMETRY_ENABLED=false
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/status"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  infisical-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=infisical
      - POSTGRES_PASSWORD=${INFISICAL_POSTGRES_PASSWORD}
      - POSTGRES_DB=infisical
    volumes:
      - infisical-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infisical"]
      interval: 5s
      timeout: 5s
      retries: 10

  infisical-redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${INFISICAL_REDIS_PASSWORD}"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${INFISICAL_REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Stateless TCP forwarder so the Infisical UI/API is reachable over Tailscale
  # (100.115.104.5) without a manual SSH tunnel. Deliberately a separate,
  # disposable container - NOT a change to `infisical` itself - after adding
  # a `ports:` mapping directly to infisical caused DNS/startup instability
  # (see coolify_service_networking_gotcha memory).
  infisical-tailscale-proxy:
    image: alpine/socat
    restart: unless-stopped
    command: ["-d", "-d", "tcp-listen:8080,fork,reuseaddr", "tcp-connect:infisical:8080"]
    ports:
      - "100.115.104.5:18789:8080"
    depends_on:
      - infisical

volumes:
  infisical-postgres-data:
