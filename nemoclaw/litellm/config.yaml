# NemoClaw LiteLLM proxy model map.
#
# STATUS: verified live via real chat-completion calls through this proxy on 2026-08-17/18.
# DECISION 2026-08-17 (user): use open-source models for now. Claude (haiku/sonnet/opus) and
# GPT-5.3-Codex are all correctly configured on DO but blocked with 403 "not available for your
# subscription tier" - a DO plan/billing decision, not a config problem. Rather than block
# Phase 3 on that decision, the tier-concept alias NAMES from agent-model-table.csv (haiku,
# sonnet, opus, gpt-codex) are kept as-is so agent configs don't need to change later, but each
# now points at a verified-working open model instead. The original Claude/GPT slug for each is
# preserved in a comment - reverting once the tier is upgraded is a one-line change per alias.
#
# Open-model substitution mapping (revisit if the DO tier gets upgraded):
#   haiku      -> glm-5.2           (was anthropic-claude-haiku-4.5)   - cheap/fast tier
#   sonnet     -> qwen3.8-max       (was anthropic-claude-4.6-sonnet)  - mid/high reasoning tier
#   opus       -> qwen3.8-max       (was anthropic-claude-opus-4.8)    - highest reasoning tier
#                 (same model as sonnet for now - no confirmed-stronger open model on DO yet;
#                  kimi-k3 / mimo-v2.5-pro exist but are UNTESTED)
#   gpt-codex  -> qwen3-coder-flash (was openai-gpt-5.3-codex)
#
# DECISION 2026-08-17 (user): no Gemini/Google at all - provider-direct exception removed entirely.
#
# ---------------------------------------------------------------------------------------------
# PRICING (added 2026-08-18) - REQUIRED FOR BUDGETS TO WORK AT ALL.
# Without model_info costs, LiteLLM logs every request at spend=$0.00 (tokens ARE still counted),
# so per-client max_budget NEVER triggers and budgets fail OPEN. Verified: 45 spend-log rows, 20
# with tokens>0, ALL at spend 0.0, and a $0.01-budget key still serving traffic.
#
# Values come from `doctl gradient list-models` -> pricing{}. CRITICAL UNIT TRAP: the field is
# named `input_price_per_million` but the VALUE IS DOLLARS PER TOKEN. Verified against models with
# public list prices: GPT-5 raw 1.25e-06 -> $1.25/M (correct), Claude Sonnet 4.6 raw 3e-06 ->
# $3.00/M (correct), Claude Opus 4.5 raw 5e-06 -> $5.00/M (correct). Treating the value as
# per-million would understate cost by 1,000,000x.
# Written as plain decimals on purpose: YAML 1.1 parses `7e-07` as a STRING, not a float.
# Re-check these when DO changes pricing - they are a snapshot, not a live feed.
# ---------------------------------------------------------------------------------------------

model_list:

  # ONE MODEL. Decision 2026-08-18 after a direct head-to-head on the publish stage that had been
  # producing fabrications. Same prompt, same payload, no tools available:
  #
  #   deepseek-v4-pro  -> published:false, real URL      HONEST   970 tokens
  #   glm-5.2          -> published:TRUE, invented URL   LIED    2092 tokens
  #   qwen3.8-max      -> published:false, fake domain   PARTIAL 2456 tokens
  #
  # glm-5.2 was behind all three confabulations seen that day (an r2.dev spam redirect, a fake
  # Google Maps link, and invented Postiz post IDs). deepseek was the only model that neither
  # claimed success nor invented a domain — and it did so in under half the tokens.
  #
  # Aliases are TIERS, not vendors, so swapping a tier is a one-line change here and no agent
  # config moves. All three point at deepseek today; the tier split marks where escalation goes
  # when stronger models are enabled (QA and PM review are the intended first upgrades).

  - model_name: fast
    litellm_params: &deepseek
      model: openai/deepseek-v4-pro
      api_base: https://inference.do-ai.run/v1
      api_key: os.environ/DO_INFERENCE_KEY
    model_info: &deepseek_cost
      # From `doctl gradient list-models` 2026-08-18. An earlier value of $0.87/$1.74
      # was WRONG and under-counted every budget — see the Phase 2 note on budgets
      # failing open when costs are missing or understated.
      input_cost_per_token: 0.00000132   # DO: DeepSeek V4 Pro  $1.32/M in
      output_cost_per_token: 0.00000396  # DO: DeepSeek V4 Pro  $3.96/M out

  - model_name: standard
    litellm_params: *deepseek
    model_info: *deepseek_cost

  # Reserved for judgement-critical work (QA, PM review). Same model for now.
  - model_name: deep
    litellm_params: *deepseek
    model_info: *deepseek_cost

  # ---- Hermes conversational tier ----
  # Hermes is the client-facing front-door: high turn count, low reasoning depth. deepseek-v4-flash
  # is ~16x cheaper in / ~16x cheaper out than v4-pro ($0.08/$0.25 vs $1.32/$3.96), which matters
  # when a client is chatting rather than the fleet producing deliverables.
  - model_name: flash
    litellm_params:
      model: openai/deepseek-v4-flash-0731
      api_base: https://inference.do-ai.run/v1
      api_key: os.environ/DO_INFERENCE_KEY
    model_info:
      input_cost_per_token: 0.00000008    # $0.08/M in
      output_cost_per_token: 0.000000252  # $0.252/M out

  # ---- Embeddings, for OpenClaw's memory vector index ----
  # OpenClaw has native vector search (sqlite-vec + FTS) but needs an embedding backend. Routing
  # it through LiteLLM keeps memory indexing spend on the same key/budget as everything else.
  # bge-m3 is $0.02/M — memory reindexing is high-volume, so the cheap model matters here.
  - model_name: embed
    litellm_params:
      model: openai/bge-m3
      api_base: https://inference.do-ai.run/v1
      api_key: os.environ/DO_INFERENCE_KEY
    model_info:
      mode: embedding
      input_cost_per_token: 0.00000002   # $0.02/M in
      output_cost_per_token: 0.0         # embeddings return vectors, not billed tokens out

  # OpenAI's OPEN-WEIGHT models. These are NOT partner models, so they are not caught by the
  # subscription-tier gate below — verified working 2026-08-18. Materially cheaper than deepseek
  # ($1.32/$3.96), so worth considering for high-volume, low-judgement stages once their honesty
  # has been measured the same way deepseek's was. Not assigned to any agent yet.
  - model_name: oss-120b
    litellm_params:
      model: openai/openai-gpt-oss-120b
      api_base: https://inference.do-ai.run/v1
      api_key: os.environ/DO_INFERENCE_KEY
    model_info:
      input_cost_per_token: 0.000000055   # $0.055/M in
      output_cost_per_token: 0.000000385  # $0.385/M out

  - model_name: oss-20b
    litellm_params:
      model: openai/openai-gpt-oss-20b
      api_base: https://inference.do-ai.run/v1
      api_key: os.environ/DO_INFERENCE_KEY
    model_info:
      input_cost_per_token: 0.00000005    # $0.05/M in
      output_cost_per_token: 0.00000045   # $0.45/M out

# ---------------------------------------------------------------------------
# ANTHROPIC + OPENAI via DigitalOcean — DEFINED BUT BLOCKED AT THE ACCOUNT LEVEL (2026-08-18)
#
# Routing is correct and settled: send to DO's OpenAI-compatible endpoint
# (https://inference.do-ai.run) authenticated with DO_INFERENCE_KEY. The user's Anthropic key is
# registered with DigitalOcean as a Partner Model Provider Key in the DO Control Panel, so DO holds
# it and routes on our behalf. We never call api.anthropic.com or api.openai.com directly — that is
# unsupported.
#
# STATUS: every partner model still returns
#     403 "this model is not available for your subscription tier"
# This is NOT a credential or routing problem. Verified by elimination on 2026-08-18:
#     anthropic-claude-haiku-4.5   403      openai-gpt-4o-mini   403   ($0.15/M — cheapest tier)
#     anthropic-claude-4.5-sonnet  403      openai-gpt-5-nano    403   ($0.05/M — cheapest tier)
#     openai-gpt-oss-20b            OK      deepseek-v4-pro       OK   (open-weight)
# The gate is blanket over ALL partner/proprietary models regardless of price, so it is an account
# entitlement, not a per-model tier. Registering the partner provider key did not change it.
#
# These entries are left in place, priced and ready: when the entitlement is granted they work with
# no config change. Until then they fail loudly with 403 rather than costing anything.
#
# COST NOTE: because these are bring-your-own-key, DO returns NO pricing for them via the API, and
# LiteLLM's built-in cost map does not know these slugs either. Every cost below is therefore set
# by hand from `doctl gradient list-models`. Without them, spend logs $0.00 and budgets fail OPEN —
# that exact bug was found and fixed in Phase 2. Do not add a model here without its price.
# ---------------------------------------------------------------------------

  - model_name: claude-haiku
    litellm_params:
      model: openai/anthropic-claude-haiku-4.5
      api_base: https://inference.do-ai.run/v1
      api_key: os.environ/DO_INFERENCE_KEY
    model_info:
      input_cost_per_token: 0.000001    # $1.00/M in
      output_cost_per_token: 0.000005   # $5.00/M out

  - model_name: claude-sonnet
    litellm_params:
      model: openai/anthropic-claude-5-sonnet
      api_base: https://inference.do-ai.run/v1
      api_key: os.environ/DO_INFERENCE_KEY
    model_info:
      input_cost_per_token: 0.000002    # $2.00/M in
      output_cost_per_token: 0.00001    # $10.00/M out

  - model_name: claude-opus
    litellm_params:
      model: openai/anthropic-claude-opus-5
      api_base: https://inference.do-ai.run/v1
      api_key: os.environ/DO_INFERENCE_KEY
    model_info:
      input_cost_per_token: 0.000005    # $5.00/M in
      output_cost_per_token: 0.000025   # $25.00/M out

  - model_name: gpt
    litellm_params:
      model: openai/openai-gpt-5.4
      api_base: https://inference.do-ai.run/v1
      api_key: os.environ/DO_INFERENCE_KEY
    model_info:
      input_cost_per_token: 0.0000025   # $2.50/M in
      output_cost_per_token: 0.000015   # $15.00/M out

  - model_name: gpt-codex
    litellm_params:
      model: openai/openai-gpt-5.3-codex
      api_base: https://inference.do-ai.run/v1
      api_key: os.environ/DO_INFERENCE_KEY
    model_info:
      input_cost_per_token: 0.00000175  # $1.75/M in
      output_cost_per_token: 0.000014   # $14.00/M out

# DELIBERATELY NOT WIRED — the "pro" tiers are 10-40x the cost of their siblings and nothing in the
# fleet needs them: openai-gpt-5.4-pro ($30/M in, $180/M out), openai-gpt-5.2-pro ($21/$168).
# Add one only for a specific, justified job.

litellm_settings:
  success_callback: ["langfuse"]
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # REQUIRED for the A2A agent registry to survive a restart.
  #
  # LiteLLM DOES have rehydration code (_init_agents_in_db), but it is only reachable inside an
  # `if store_model_in_db is True:` branch — with the flag off it is dead code, the in-memory
  # registry starts empty and never refills. Proven here 2026-08-18: after a restart the agent row
  # was still in LiteLLM_AgentsTable while GET /v1/agents returned []. Keys and teams are
  # unaffected because they are read per-request rather than registry-cached.
  # Upstream bug: github.com/BerriAI/litellm/issues/33062 (open). Upgrading does not fix it.
  #
  # This is NOT cosmetic: /a2a/{agent_id} and `model: "a2a/<name>"` both resolve ONLY from the
  # in-memory registry, so an empty registry breaks A2A routing, not just the UI listing.
  #
  # Two consequences to keep in mind:
  #   * It starts a ~30s reconcile loop where DB-stored settings begin overriding this file.
  #     Safe for us today: LiteLLM_Config was verified EMPTY before enabling.
  #   * Deliberately NOT setting `supported_db_objects` — omitting an object type disables DB
  #     loading for it, and "agents" is not even a member of the accepted enum.
  store_model_in_db: true

# Per-client virtual keys are created via LiteLLM's /key/generate with:
#   max_budget: <client dollar cap>, metadata: {client_id: <id>}, models: [<allowed aliases>]
# Agents authenticate with the acting client's virtual key so spend + limits attribute correctly.

# ---------------------------------------------------------------- MCP servers
#
# These are the ground truth NemoClaw's layer-1 tool gate reads (`GET /v1/mcp/server`). A stage
# declaring `requires_tools: [postiz]` in pipelines.yaml hard-fails BEFORE the model is called
# unless the matching server appears here AND is reachable. See orchestrator/verification.py.
#
# RULE (user): official / first-party MCP servers only. Where no official server exists, wrap the
# vendor's own REST API ourselves rather than adopting a community server.
mcp_servers:
  # Client assets in DigitalOcean Spaces. DO's own MCP server covers key MANAGEMENT only
  # (spaces-key-create/delete/get/list/update) with no object operations, so per the
  # official-servers-first rule this is our own thin wrapper over DO's S3-compatible API.
  # Tenant isolation is enforced inside the server: every path is confined to clients/<slug>/
  # and traversal is rejected in code, not by prompt instruction.
  spaces:
    url: http://mcp-spaces-bsx4ax3q1uk3tcgq4pvqpxkb:8080/mcp
    transport: http
    description: "Client asset storage (DigitalOcean Spaces): list, read, write, presign, delete"
    access_groups: ["fleet_tools"]

  # Self-hosted Postiz (our own infra). Covers Facebook, Instagram AND Google Business Profile —
  # all three integrations are connected and live, so GMB posting rides on Postiz rather than
  # needing a separate Google Business Profile API wrapper.
  postiz:
    url: https://postiz.widev.com.au/api/mcp
    transport: http
    description: "Social + GMB scheduling and publishing via self-hosted Postiz"
    auth_type: bearer_token
    auth_value: os.environ/POSTIZ_MCP_TOKEN
    access_groups: ["fleet_tools"]

# ---------------------------------------------------------------- guardrails & policies
#
# GUARDRAILS ARE CONFIG-DECLARED, not API-created. `POST /guardrails` returns 200 on our community
# licence but the guardrail does not appear in /guardrails/list — declaring them here is what makes
# them real. (Creation is NOT licence-gated; only the per-KEY guardrail assignment fields are, and
# policy attachments route around that.)
#
# litellm_content_filter is deliberate: it is on-device regex/keyword matching with NO external
# dependency, so there is no extra service to run and no per-request network hop. Presidio would
# need a sidecar we do not have.
#
# SCOPE OF WHAT THIS CAN DO: it catches shapes, not meaning. It is the right tool for "a credential
# must never transit the proxy" and the wrong tool for "is this marketing claim compliant" — that is
# a judgement, and it belongs to the qa agent, which is why qa runs on the `deep` tier.
guardrails:
  - guardrail_name: "wi-credential-block"
    litellm_params:
      guardrail: litellm_content_filter
      mode: pre_call
      default_on: true
      patterns:
        # Only pattern_name values confirmed in the LiteLLM docs are used here. Do not add
        # unverified names — an unknown pattern_name risks the whole config failing to load.
        - pattern_type: "prebuilt"
          pattern_name: "aws_access_key"
          action: "BLOCK"
        - pattern_type: "prebuilt"
          pattern_name: "us_ssn"
          action: "BLOCK"

  # Output-side pass. An agent that has read a credential from a file must not echo it back into a
  # response, a social post, or a client-facing message.
  - guardrail_name: "wi-credential-block-output"
    litellm_params:
      guardrail: litellm_content_filter
      mode: post_call
      default_on: true
      patterns:
        - pattern_type: "prebuilt"
          pattern_name: "aws_access_key"
          action: "BLOCK"

# Policies group guardrails and are attached by scope. Scope "*" is every request, which is correct
# for credential hygiene — no client should be exempt from it.
policies:
  wi-baseline:
    guardrails:
      add:
        - wi-credential-block
        - wi-credential-block-output

policy_attachments:
  - policy: wi-baseline
    scope: "*"
